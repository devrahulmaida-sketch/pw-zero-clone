<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL-PW | THE OMNI-MACHINE V8</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b; --bg-card: #18181b; --accent: #3b82f6; 
            --accent-glow: rgba(59, 130, 246, 0.5); --text-main: #fafafa; 
            --text-dim: #a1a1aa; --border: #27272a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); }

        header {
            height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
            background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .brand span { color: var(--accent); }
        .status { font-size: 12px; color: #22c55e; }
        .search-container { flex-grow: 1; margin: 0 40px; }
        #search-bar { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #27272a; color: white; }

        main { padding: 30px 40px; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }

        .card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; position: relative;
        }
        .card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .card-img-wrap { width: 100%; height: 160px; background: #27272a; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-content { padding: 16px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 45px; }

        .fav-btn { cursor: pointer; float: right; color: var(--text-dim); font-size: 20px; }
        .fav-btn.active { color: #f59e0b; }
        
        .action-btn { width: 100%; padding: 12px; background: var(--accent); color: white; text-align: center; border-radius: 10px; font-weight: 700; font-size: 14px; margin-top: 10px; }

        .pagination { display: flex; justify-content: center; gap: 20px; padding: 40px; }
        .page-btn { padding: 12px 24px; background: #27272a; border-radius: 12px; cursor: pointer; font-weight: 700; border: 1px solid var(--border); }
        .page-btn:hover:not(.disabled) { background: var(--accent); }
        .page-btn.disabled { opacity: 0.3; cursor: not-allowed; }

        @media (max-width: 768px) { header { padding: 0 20px; } main { padding: 20px; } }
    </style>
</head>
<body>
    <header>
        <div class="brand">RAHUL<span>-PW</span></div>
        <div class="search-container"><input type="text" id="search-bar" placeholder="Search..." oninput="handleSearch()"></div>
        <div class="status">V8 HIGH-FIDELITY</div>
    </header>
    <main id="grid" class="grid"></main>
    <div class="pagination">
        <div id="prev-btn" class="page-btn" onclick="changePage(-1)">PREV</div>
        <div style="align-self:center" id="page-info">1</div>
        <div id="next-btn" class="page-btn" onclick="changePage(1)">NEXT</div>
    </div>

    <script>
        let allBatches = [];
        let filteredBatches = [];
        let currentPage = 1;
        const itemsPerPage = 15;
        let favorites = JSON.parse(localStorage.getItem('favs') || '[]');

        async function init() {
            const res = await fetch('batches.json');
            const data = await res.json();
            allBatches = data.batches;
            filteredBatches = allBatches;
            render();
        }

        function handleSearch() {
            const q = document.getElementById('search-bar').value.toLowerCase();
            filteredBatches = allBatches.filter(b => b.name.toLowerCase().includes(q));
            currentPage = 1;
            render();
        }

        function toggleFav(id) {
            if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
            else favorites.push(id);
            localStorage.setItem('favs', JSON.stringify(favorites));
            render();
        }

        function render() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const start = (currentPage - 1) * itemsPerPage;
            const pageItems = filteredBatches.slice(start, start + itemsPerPage);
            
            pageItems.forEach(b => {
                const id = b._id || b.batch_id;
                // Priority: previewImage -> photo -> default fallback
                const img = b.previewImage || b.photo || 'https://i.ibb.co/VYb8s0Xw/learnwithrahulmaidalogo.webp';
                const bName = encodeURIComponent(b.name).replace(/%20/g,'+');
                
                const el = document.createElement('div');
                el.className = 'card';
                el.innerHTML = `
                    <span class="fav-btn ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav('${id}')">★</span>
                    <div class="card-img-wrap">
                        <img src="${img}" class="card-img" loading="lazy" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://i.ibb.co/VYb8s0Xw/learnwithrahulmaidalogo.webp'">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${b.name}</div>
                        <div class="action-btn" onclick="window.location.href='https://stream.testuk.org/subjects?batchId=${id}&batchName=${bName}'">ENTER</div>
                    </div>
                `;
                grid.appendChild(el);
            });
            document.getElementById('page-info').innerText = currentPage;
        }

        function changePage(dir) {
            if (currentPage + dir > 0 && (currentPage + dir - 1) * itemsPerPage < filteredBatches.length) {
                currentPage += dir;
                render();
            }
        }
        init();
    </script>
</body>
</html>
