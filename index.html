<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL-PW | THE OMNI-MACHINE V4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: #18181b;
            --accent: #3b82f6;
            --text-main: #fafafa;
            --text-dim: #a1a1aa;
            --border: #27272a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .brand span { color: var(--accent); }

        main { padding: 30px 40px; max-width: 1400px; margin: 0 auto; min-height: calc(100vh - 70px); }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .card-img-wrap { width: 100%; height: 160px; background: #27272a; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-content { padding: 16px; }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 42px; }

        .action-btn {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background: var(--accent);
            color: white;
            font-weight: 700;
            font-size: 13px;
            text-align: center;
        }

        /* Pagination */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
            border-top: 1px solid var(--border);
        }
        .page-btn {
            padding: 12px 24px;
            background: #27272a;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .page-btn:hover:not(.disabled) { background: var(--accent); border-color: white; }
        .page-btn.disabled { opacity: 0.3; cursor: not-allowed; }
        .page-info { font-size: 14px; color: var(--text-dim); }

        @media (max-width: 768px) {
            header { padding: 0 20px; }
            main { padding: 20px; }
            .content-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">RAHUL<span>-PW</span></div>
        <div style="font-size: 12px; color: #22c55e;">V4 PAGINATED CORE</div>
    </header>

    <main>
        <div id="grid" class="content-grid">
            <!-- Batches will be injected -->
        </div>

        <div class="pagination">
            <div id="prev-btn" class="page-btn" onclick="changePage(-1)">PREVIOUS</div>
            <div class="page-info">PAGE <span id="current-page">1</span></div>
            <div id="next-btn" class="page-btn" onclick="changePage(1)">NEXT</div>
        </div>
    </main>

    <script>
        let fullBatches = [];
        let currentPage = 1;
        const itemsPerPage = 15;

        async function init() {
            try {
                // Fetching from local batches.json for instant load
                const res = await fetch('batches.json');
                if (!res.ok) throw new Error("Fetch failed");
                const data = await res.json();
                fullBatches = data.batches || [];
                console.log(`[!] Matrix loaded: ${fullBatches.length} batches`);
                renderPage(1);
            } catch (e) {
                console.error("[!] Matrix access denied:", e);
                document.getElementById('grid').innerHTML = '<div style="text-align:center; padding: 100px;">Sir, system initialization failed. Refresh (Ctrl+F5).</div>';
            }
        }

        function renderPage(page) {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = fullBatches.slice(start, end);

            pageItems.forEach(b => {
                const id = b._id || b.batch_id;
                const img = b.previewImage || b.photo || 'https://eduzex.is-great.org/pw_banner.png';
                const el = document.createElement('div');
                el.className = 'card';
                
                // HYPER-SPEED REDIRECTION TO SUBJECTS - SAME TAB
                const bName = encodeURIComponent(b.name).replace(/%20/g, '+');
                const redirectUrl = `https://stream.testuk.org/subjects?batchId=${id}&batchName=${bName}`;
                
                el.onclick = () => {
                    console.log(`[+] Executing Direct Subjects Redirect: ${redirectUrl}`);
                    window.location.replace(redirectUrl);
                };

                el.innerHTML = `
                    <div class="card-img-wrap">
                        <img src="${img}" class="card-img" onerror="this.src='https://eduzex.is-great.org/pw_banner.png'">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${b.name}</div>
                        <div class="action-btn">ENTER BATCH</div>
                    </div>
                `;
                grid.appendChild(el);
            });

            // Update UI
            document.getElementById('current-page').innerText = page;
            document.getElementById('prev-btn').classList.toggle('disabled', page === 1);
            document.getElementById('next-btn').classList.toggle('disabled', end >= fullBatches.length);
            
            // Scroll to top
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function changePage(dir) {
            const next = currentPage + dir;
            if (next < 1 || (dir > 0 && currentPage * itemsPerPage >= fullBatches.length)) return;
            currentPage = next;
            renderPage(currentPage);
        }

        // START SYSTEM
        init();
    </script>
</body>
</html>
