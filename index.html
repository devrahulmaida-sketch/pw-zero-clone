<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL-PW | THE OMNI-MACHINE V3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: #18181b;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-main: #fafafa;
            --text-dim: #a1a1aa;
            --border: #27272a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); overflow-x: hidden; }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .brand span { color: var(--accent); }
        .status { font-size: 12px; color: #22c55e; display: flex; align-items: center; gap: 6px; }
        .status::before { content: ''; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; }

        main { padding: 30px 40px; max-width: 1400px; margin: 0 auto; min-height: calc(100vh - 70px); }
        .nav-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; font-size: 14px; color: var(--text-dim); }
        .nav-item { cursor: pointer; transition: color 0.2s; }
        .nav-item:hover { color: var(--accent); }
        .nav-item.active { color: var(--text-main); font-weight: 600; }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            opacity: 1;
            transition: opacity 0.1s ease;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        .card-img-wrap { width: 100%; height: 180px; position: relative; background: #27272a; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-badge { position: absolute; top: 12px; right: 12px; background: var(--accent); color: white; padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; }

        .card-content { padding: 20px; }
        .card-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-desc { font-size: 13px; color: var(--text-dim); margin-bottom: 16px; }

        .action-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            background: #27272a;
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-align: center;
            border: 1px solid transparent;
        }
        .card:hover .action-btn { background: var(--accent); }

        .loader-wrap { display: none; padding: 100px 0; text-align: center; width: 100%; font-weight: 700; color: var(--accent); }

        @media (max-width: 768px) {
            header { padding: 0 20px; }
            main { padding: 20px; }
            .content-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">RAHUL<span>-PW</span></div>
        <div class="status">HYPER-SPEED ACTIVE</div>
    </header>

    <main>
        <div class="nav-bar" id="nav-bar">
            <span class="nav-item active" onclick="loadBatches()">Home</span>
        </div>

        <div id="loader" class="loader-wrap">FATAFAT DATA LOADING...</div>

        <div id="grid" class="content-grid"></div>
    </main>

    <script>
        const KEY = "ENCRYPT_KEY_4431";
        const PROXY = "https://pw-zero.pages.dev/proxy";
        
        let state = { batchId: '', subjectId: '', history: [] };

        function encodeParams(params) {
            const json = encodeURIComponent(JSON.stringify(params));
            let xor = "";
            for (let i = 0; i < json.length; i++) {
                xor += String.fromCharCode(json.charCodeAt(i) ^ KEY.charCodeAt(i % KEY.length));
            }
            return Array.from(xor).map(c => c.charCodeAt(0).toString(16).padStart(2, "0")).join("");
        }

        async function api(action, extras = {}) {
            // REMOVED SLOW FULL-SCREEN LOADER
            if (action === 'get_batches_list') {
                try {
                    const res = await fetch('batches.json');
                    return await res.json();
                } catch (e) { console.warn("Local fallback..."); }
            }

            const q = encodeParams({ action, ...extras });
            try {
                const res = await fetch(`${PROXY}?q=${q}`);
                return await res.json();
            } catch (err) {
                console.error(err);
                return null;
            }
        }

        async function loadBatches() {
            const data = await api('get_batches_list');
            if (!data || !data.batches) return;
            
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            document.getElementById('nav-bar').innerHTML = '<span class="nav-item active">Home</span>';

            data.batches.forEach(b => {
                const id = b._id || b.batch_id;
                const img = b.previewImage || b.photo || 'https://eduzex.is-great.org/pw_banner.png';
                const el = document.createElement('div');
                el.className = 'card';
                el.onclick = () => loadSubjects(id, b.name);
                el.innerHTML = `
                    <div class="card-img-wrap"><img src="${img}" class="card-img" onerror="this.src='https://eduzex.is-great.org/pw_banner.png'"></div>
                    <div class="card-content">
                        <div class="card-title">${b.name}</div>
                        <div class="action-btn">ACCESS</div>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        async function loadSubjects(batchId, batchName) {
            state.batchId = batchId;
            // Immediate feedback: clear grid
            document.getElementById('grid').innerHTML = '<div class="loader-wrap" style="display:block">FETCHING SUBJECTS...</div>';
            
            const data = await api('get_subjects', { batchId });
            if (!data || !data.data) { loadBatches(); return; }

            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            document.getElementById('nav-bar').innerHTML = `<span class="nav-item" onclick="loadBatches()">Home</span> / <span class="nav-item active">${batchName}</span>`;

            data.data.forEach(s => {
                const id = s.id || s._id;
                const name = s.name || s.subject;
                const img = s.imageUrl || 'https://eduzex.is-great.org/pw/pi_icon.png';
                const el = document.createElement('div');
                el.className = 'card';
                
                // HYPER-SPEED REDIRECTION: SAME TAB
                const redirectUrl = `https://stream.testuk.org/content?batchId=${batchId}&subjectId=${id}&batchName=${encodeURIComponent(batchName)}&subjectName=${encodeURIComponent(name)}`;
                
                el.onclick = (e) => {
                    e.preventDefault();
                    window.location.replace(redirectUrl); // HARD REDIRECT - SAME TAB
                };

                el.innerHTML = `
                    <div class="card-img-wrap"><img src="${img}" class="card-img" onerror="this.src='https://eduzex.is-great.org/pw/pi_icon.png'"></div>
                    <div class="card-content">
                        <div class="card-title">${name}</div>
                        <div class="action-btn" style="background:#22c55e">OPEN IN STREAM</div>
                    </div>
                `;
                grid.appendChild(el);
            });
        }

        loadBatches();
    </script>
</body>
</html>
