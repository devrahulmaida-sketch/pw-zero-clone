<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHUL-PW | THE OMNI-MACHINE V6</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-dark: #09090b; --bg-card: #18181b; --accent: #3b82f6; --text-main: #fafafa; --text-dim: #a1a1aa; --border: #27272a; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); }

        header {
            height: 70px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px;
            background: rgba(9, 9, 11, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 1000;
        }
        .brand { font-size: 24px; font-weight: 800; letter-spacing: -1px; }
        .brand span { color: var(--accent); }
        .status { font-size: 12px; color: #22c55e; }

        main { padding: 30px 40px; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

        .card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; overflow: hidden;
            transition: all 0.3s ease; cursor: pointer; will-change: transform;
        }
        .card:hover { transform: translateY(-4px); border-color: var(--accent); }

        .card-img-wrap { width: 100%; height: 160px; background: #27272a; }
        .card-img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 16px; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
        .action-btn { width: 100%; padding: 10px; background: var(--accent); color: white; text-align: center; border-radius: 8px; font-weight: 600; font-size: 13px; }

        @media (max-width: 768px) { header { padding: 0 20px; } main { padding: 20px; } }
    </style>
</head>
<body>
    <header>
        <div class="brand">RAHUL<span>-PW</span></div>
        <div class="status" id="status">OPTIMIZED V6</div>
    </header>
    <main id="grid" class="grid">Loading...</main>

    <script>
        async function init() {
            try {
                const res = await fetch('batches.json');
                const data = await res.json();
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                
                // Optimized rendering: slice for initial load, then add rest later if needed
                data.batches.slice(0, 30).forEach(b => {
                    const id = b._id || b.batch_id;
                    const img = b.previewImage || b.photo || 'https://eduzex.is-great.org/pw_banner.png';
                    const bName = encodeURIComponent(b.name).replace(/%20/g, '+');
                    
                    const el = document.createElement('div');
                    el.className = 'card';
                    el.onclick = () => window.location.href = `https://stream.testuk.org/subjects?batchId=${id}&batchName=${bName}`;
                    el.innerHTML = `
                        <div class="card-img-wrap">
                            <img src="${img}" class="card-img" loading="lazy" onerror="this.src='https://eduzex.is-great.org/pw_banner.png'">
                        </div>
                        <div class="card-content">
                            <div class="card-title">${b.name}</div>
                            <div class="action-btn">ENTER BATCH</div>
                        </div>
                    `;
                    grid.appendChild(el);
                });
            } catch (e) {
                document.getElementById('status').innerText = "ERROR";
            }
        }
        init();
    </script>
</body>
</html>
